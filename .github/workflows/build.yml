name: Build Kiosk Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build installer
        run: npm run build -- --publish never
        env:
          ELECTRON_GET_TIMEOUT: '120000'

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldLinkKiosk-installer
          path: dist/*.exe

      # The installer name carries the version, so without this the "latest"
      # release would accumulate one .exe per build and the FieldLink server
      # (which serves the release's installer) could hand out an old one.
      - name: Remove previous installers from the latest release
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $names = gh release view latest --repo $env:GITHUB_REPOSITORY --json assets -q '.assets[].name' 2>$null
          if (-not $names) { Write-Host 'No existing latest release or no assets.'; exit 0 }
          foreach ($n in $names) {
            if ($n -like '*.exe' -or $n -like '*.blockmap' -or $n -like '*.yml') {
              Write-Host "Deleting old asset $n"
              gh release delete-asset latest $n --repo $env:GITHUB_REPOSITORY --yes
            }
          }

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: FieldLinkKiosk Installer
          files: dist/*.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Invalidate server installer cache
        if: success()
        run: |
          if (-not $env:SERVER_URL) { Write-Host "No SERVER_URL configured, skipping cache invalidation."; exit 0 }
          try {
            Invoke-WebRequest -Uri "$env:SERVER_URL/api/kiosk/installer/invalidate" `
              -Method POST `
              -Headers @{ "x-webhook-secret" = "$env:WEBHOOK_SECRET"; "Content-Type" = "application/json" } `
              -UseBasicParsing | Out-Null
            Write-Host "Cache invalidated successfully"
          } catch {
            Write-Host "Cache invalidation skipped: $_"
          }
        shell: pwsh
        env:
          SERVER_URL: ${{ secrets.FIELDLINK_SERVER_URL }}
          WEBHOOK_SECRET: ${{ secrets.KIOSK_WEBHOOK_SECRET }}
